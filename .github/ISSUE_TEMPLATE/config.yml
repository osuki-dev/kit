blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/osuki-dev/kit/security
    about: Report privately through the Security tab. Never open a public issue.
  - name: Question or usage help
    url: https://github.com/osuki-dev/kit/discussions
    about: Ask in Discussions. The issue tracker is for defects and proposals.
  - name: Expo or React Native bug
    url: https://github.com/expo/expo/issues
    about: Report upstream bugs to the upstream project, then link the issue here if a version bump is needed.
