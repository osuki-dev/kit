appId: dev.osuki.kit
name: auth-validation
---
- launchApp:
    clearState: true
    stopApp: true
- openLink: "osuki://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Osuki Market"
    timeout: 60000

- openLink: "osuki:///auth-screen"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Account"
    timeout: 10000
- tapOn:
    id: "auth-submit-button"

- extendedWaitUntil:
    visible: "Check the highlighted fields and try again."
    timeout: 10000
- assertVisible: "Enter your email address."
- assertVisible: "Enter your password."
- tapOn:
    id: "auth-email-input"
- inputText: "avery@example.com"

- hideKeyboard
- scrollUntilVisible:
    element:
      id: "auth-password-input"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "auth-password-input"

- tapOn:
    id: "auth-password-input"
- inputText: "password123"

- hideKeyboard
- scrollUntilVisible:
    element:
      id: "auth-submit-button"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "auth-submit-button"

- tapOn:
    id: "auth-submit-button"

- extendedWaitUntil:
    visible: "SIGNED IN"
    timeout: 10000
- assertVisible: "avery@example.com"
