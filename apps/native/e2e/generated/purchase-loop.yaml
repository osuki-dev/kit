appId: dev.osuki.kit
name: purchase-loop
---
- launchApp:
    clearState: true
    stopApp: true
- openLink: "osuki://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Osuki Market"
    timeout: 60000

- extendedWaitUntil:
    visible:
      id: "home-featured-banner"
    timeout: 10000
- tapOn:
    id: "home-shop-featured"

- scrollUntilVisible:
    element:
      id: "product-add-to-cart"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "product-add-to-cart"

- tapOn:
    id: "product-add-to-cart"

- scrollUntilVisible:
    element:
      id: "cart-checkout"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "cart-checkout"

- tapOn:
    id: "cart-checkout"

- extendedWaitUntil:
    visible: "ORDER SUMMARY"
    timeout: 10000
- tapOn:
    id: "checkout-continue-shipping"

- extendedWaitUntil:
    visible: "PAYMENT METHOD"
    timeout: 10000
- tapOn:
    id: "checkout-continue-payment"

- extendedWaitUntil:
    visible: "ORDER REVIEW"
    timeout: 10000
- tapOn:
    id: "checkout-place-order"

- extendedWaitUntil:
    visible: "TRACKING NUMBER"
    timeout: 10000
- assertVisible: "TRACKING NUMBER"
