appId: dev.osuki.kit
name: account-checkout-flow
---
- launchApp:
    clearState: true
    stopApp: true
- openLink: "osuki://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Osuki Market"
    timeout: 60000

- openLink: "osuki:///account"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Account"
    timeout: 10000
- tapOn:
    id: "account-sign-in-button"

- extendedWaitUntil:
    visible: "Account"
    timeout: 10000
- tapOn:
    id: "auth-email-input"
- inputText: "avery@example.com"

- tapOn:
    id: "auth-password-input"
- inputText: "password123"

- hideKeyboard
- tapOn:
    id: "auth-submit-button"

- extendedWaitUntil:
    visible: "SIGNED IN"
    timeout: 10000
- assertVisible: "avery@example.com"
- tapOn:
    id: "account-profile-entry"

- extendedWaitUntil:
    visible: "Manage the customer details used for checkout and delivery updates."
    timeout: 10000
- tapOn:
    id: "account-profile-email-input"
- inputText: "invalid-email"

- hideKeyboard
- scrollUntilVisible:
    element:
      id: "account-profile-save-button"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "account-profile-save-button"

- tapOn:
    id: "account-profile-save-button"

- extendedWaitUntil:
    visible: "Use a valid email address."
    timeout: 10000
- tapOn:
    id: "account-profile-email-input"
- inputText: "avery@example.com"

- hideKeyboard
- scrollUntilVisible:
    element:
      id: "account-profile-save-button"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "account-profile-save-button"

- tapOn:
    id: "account-profile-save-button"

- extendedWaitUntil:
    visible: "Profile updated."
    timeout: 10000
- tapOn:
    id: "account-profile-addresses-button"

- extendedWaitUntil:
    visible: "Addresses"
    timeout: 10000
- tapOn:
    id: "account-address-name-input"
- inputText: "Mika Tan"

- tapOn:
    id: "account-address-street-input"
- inputText: "21 Pine Street"

- hideKeyboard
- scrollUntilVisible:
    element:
      id: "account-address-city-input"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "account-address-city-input"

- tapOn:
    id: "account-address-city-input"
- inputText: "San Francisco"

- hideKeyboard
- scrollUntilVisible:
    element:
      id: "account-address-zip-input"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "account-address-zip-input"

- tapOn:
    id: "account-address-zip-input"
- inputText: "94108"

- hideKeyboard
- tapOn:
    id: "account-address-add-button"

- extendedWaitUntil:
    visible: "Address saved and set for checkout."
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "21 Pine Street"
    direction: DOWN
    timeout: 8000
- assertVisible: "21 Pine Street"

- openLink: "osuki:///product?id=the-inventory-not-tracked-snowboard"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "The Inventory Not Tracked Snowboard"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "product-add-to-cart"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "product-add-to-cart"

- tapOn:
    id: "product-add-to-cart"

- scrollUntilVisible:
    element:
      id: "cart-checkout"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "cart-checkout"

- tapOn:
    id: "cart-checkout"

- extendedWaitUntil:
    visible: "21 Pine Street"
    timeout: 10000
- assertVisible: "Using your default account address."
- assertVisible: "21 Pine Street"
- tapOn:
    id: "checkout-continue-shipping"

- extendedWaitUntil:
    visible: "PAYMENT METHOD"
    timeout: 10000
- tapOn:
    id: "checkout-continue-payment"

- extendedWaitUntil:
    visible: "ORDER REVIEW"
    timeout: 10000
- tapOn:
    id: "checkout-place-order"

- extendedWaitUntil:
    visible: "TRACKING NUMBER"
    timeout: 10000
- openLink: "osuki:///account-orders"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Order history"
    timeout: 10000
- assertVisible: "21 Pine Street"
- assertVisible: "The Inventory Not Tracked Snowboard"
