appId: dev.osuki.kit
name: component-coverage
---
- launchApp:
    clearState: true
    stopApp: true
- openLink: "osuki://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Osuki Market"
    timeout: 60000

- waitForAnimationToEnd:
    timeout: 5000
- openLink: "osuki:///component-e2e"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "COMPONENT E2E"
    timeout: 10000
- assertVisible: "COMPONENT E2E"
- scrollUntilVisible:
    element:
      text: "E2E BUTTON PRIMARY"
    direction: DOWN
    timeout: 8000
- assertVisible: "E2E BUTTON PRIMARY"

- tapOn:
    id: "e2e-button-primary"

- assertVisible: "BUTTON PRESSED 1"
- scrollUntilVisible:
    element:
      text: "E2E PRESSABLE CARD"
    direction: DOWN
    timeout: 8000
- assertVisible: "E2E PRESSABLE CARD"

- tapOn: "E2E PRESSABLE CARD"
- assertVisible: "CARD PRESSED 1"
- scrollUntilVisible:
