      text: "E2E TOGGLE OFF"
    direction: DOWN
    timeout: 8000
- assertVisible: "E2E TOGGLE OFF"

- tapOn: "E2E TOGGLE OFF"
- assertVisible: "E2E TOGGLE ON"
- scrollUntilVisible:
